<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080c18">
<meta name="color-scheme" content="dark light">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>JobPilot · by Sasi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%230a1628'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='system-ui' font-weight='800' font-size='16' fill='%23f0c14b'%3ES%3C/text%3E%3C/svg%3E">
<script>
try{var t=localStorage.getItem('jp-theme')||'ocean';document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='ocean'}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css?v=v11">
</head>
<body>
<div id="login-screen" class="login-screen" hidden>
  <div class="login-card">
    <div class="login-brand">
      <span class="logo logo-s">S</span>
      <div>
        <strong>JobPilot</strong>
        <em>Created by Sasi</em>
      </div>
    </div>
    <p class="login-sub">Multi-user · Token tracked · Secure</p>
    <form id="login-form" autocomplete="on">
      <label>Username<input name="username" required autocomplete="username" placeholder="sasi"></label>
      <label>Password<input name="password" type="password" required autocomplete="current-password" placeholder="••••••••"></label>
      <button type="submit" class="btn primary full">Sign in</button>
    </form>
    <p class="login-hint">Admin: <b>sasi</b> · First login sets password if empty.</p>
    <p id="login-error" class="login-error" hidden></p>
  </div>
</div>
<div class="shell" id="app-shell" hidden>
  <aside class="sidebar">
    <a class="brand" href="#jobs">
      <span class="logo logo-s">S</span>
      <div>
        <strong>JobPilot</strong>
        <em>by Sasi</em>
      </div>
    </a>
    <div class="ver-badge">Career search · Multi-user</div>
    <nav id="nav" class="side-nav" aria-label="Main"></nav>
    <div class="side-foot">
      <div class="user-chip" id="user-chip"></div>
      <div class="leds" id="leds"></div>
      <div class="theme-picker" id="theme-picker">
        <button type="button" data-t="ocean" title="Ocean">🌊</button>
        <button type="button" data-t="violet" title="Violet">💜</button>
        <button type="button" data-t="emerald" title="Emerald">💚</button>
        <button type="button" data-t="sunset" title="Sunset">🌅</button>
        <button type="button" data-t="dark" title="Classic">🌑</button>
      </div>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="topbar-left">
        <h1 id="page-title">Jobs</h1>
        <p id="page-sub" class="page-sub">Search · match · auto-apply</p>
      </div>
      <div class="topbar-right">
        <span class="live-pill">Local · 127.0.0.1</span>
        <button class="icon-btn" id="log-btn" title="Activity log" aria-label="Activity log">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 6h14M5 12h14M5 18h9"/></svg>
        </button>
      </div>
    </header>
    <section id="auto" class="autopilot" hidden aria-live="polite"></section>
    <main>
      <section id="v-jobs" class="view"></section>
      <section id="v-resume" class="view" hidden></section>
      <section id="v-portals" class="view" hidden></section>
      <section id="v-settings" class="view" hidden></section>
      <section id="v-usage" class="view" hidden></section>
      <section id="v-owner" class="view" hidden></section>
    </main>
  </div>
</div>
<div id="dock" class="dock" hidden></div>
<aside id="cfgpane" class="slidepane" hidden>
  <div class="slidepane-h"><b id="cfg-title">Configure</b><button class="btn ghost" id="cfg-close">Close</button></div>
  <div id="cfg-body" class="slidepane-body"></div>
</aside>
<aside id="logpane" class="slidepane" hidden>
  <div class="slidepane-h"><b>Activity log</b><button class="btn ghost" id="log-close">Close</button></div>
  <pre id="logtext"></pre>
</aside>
<div id="toast" class="toast" role="status"></div>
<script src="/static/app.js?v=v11.1"></script>
</body>
</html>
